# IIMT + GELLO configuration.
#
# This file contains the first static calibration. Before running the full
# teleoperation loop, verify that the IIMT and GELLO readings used to obtain
# these values came from the same physical pose and verify joint directions.

robot:
  _target_: gello.robots.iimt.IIMTRobot
  robot_ip: "192.168.8.87"
  robot_port: 29999
  servoj_period: 0.004
  # API_Servoj 发送前的关节平滑模式：raw / linear / second_order / ruckig
  # ruckig 使用速度、加速度、jerk 限制；未安装 ruckig 时回退到 second_order。
  smooth_mode: "linear"
  interpolation_duration: 0.02
  second_order_omega: 18.0
  second_order_zeta: 1.0
  joint_max_vel: 2.5
  joint_max_acc: 30.0
  joint_max_jerk: 200.0
  print_target: true
  print_target_interval: 0.5

agent:
  _target_: gello.agents.gello_agent.GelloAgent
  port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBMFB57-if00-port0"
  dynamixel_config:
    _target_: gello.agents.gello_agent.DynamixelRobotConfig
    # ID7 is the Gello gripper and is intentionally not sent to IIMT.
    joint_ids: [1, 2, 3, 4, 5, 6]
    joint_offsets: [1.100281, 5.187702, 3.554465, 9.190779, 3.309591, -1.120159]
    joint_signs: [1, 1, -1, 1, 1, 1]
    gripper_config: null

# Do not add start_joints until the calibration pose is confirmed. Otherwise
# launch_yaml.py may issue a startup motion.
hz: 500
hardware_server_port: 6001
